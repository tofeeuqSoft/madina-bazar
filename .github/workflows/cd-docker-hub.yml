name: CD — Docker Hub

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  push-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker Hub secrets
        id: check
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ DOCKERHUB_USERNAME / DOCKERHUB_TOKEN missing. Skipping push."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        if: steps.check.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Image meta
        if: steps.check.outputs.configured == 'true'
        id: meta
        run: |
          USER="${{ secrets.DOCKERHUB_USERNAME }}"
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ] || [ "$TAG" = "master" ]; then TAG=latest; fi
          echo "api=${USER}/madina-bazar-api:${TAG}" >> $GITHUB_OUTPUT
          echo "web=${USER}/madina-bazar-web:${TAG}" >> $GITHUB_OUTPUT
          echo "api_latest=${USER}/madina-bazar-api:latest" >> $GITHUB_OUTPUT
          echo "web_latest=${USER}/madina-bazar-web:latest" >> $GITHUB_OUTPUT

      - name: Build & push API
        if: steps.check.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.api }}
            ${{ steps.meta.outputs.api_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web
        if: steps.check.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ steps.meta.outputs.web }}
            ${{ steps.meta.outputs.web_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip notice
        if: steps.check.outputs.configured != 'true'
        run: echo "Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets to push images."
