# Nginx config for Madina Bazar
# Copy to: /etc/nginx/sites-available/madinabazar
# Then: sudo ln -s /etc/nginx/sites-available/madinabazar /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx

# Redirect HTTP → HTTPS (after certbot)
# server {
#     listen 80;
#     server_name www.madinabazar.com madinabazar.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name www.madinabazar.com madinabazar.com;

    # Frontend (Vite build)
    root /var/www/madina-bazar/frontend/dist;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # API → Node backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 10M;
    }

    # Uploaded images — long CDN cache
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # Cache Cloudinary is automatic on their CDN — browser can also cache proxied assets
    location ~* \.(jpg|jpeg|png|gif|webp|avif|mp4|webm)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri @backend_static;
    }
    location @backend_static {
        proxy_pass http://127.0.0.1:5000;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

